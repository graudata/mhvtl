name: packages

# Phase 7 package gate (issue #11, step 1): build the distribution packages in
# clean containers on every push/PR so packaging regressions surface before the
# FHS path rework (#10) and the later spec/OBS changes. Each target runs the
# same scripts a maintainer runs by hand (ci/build-deb.sh, ci/build-rpm.sh).
#
# Runs on ubuntu-latest and drives each distro with `docker run` rather than a
# job `container:`, so checkout stays on the host (minimal distro images ship no
# Node for the checkout action) and the build runs in a pristine image.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # meson.build is the only place the version is set; the spec and both
    # changelogs must agree with it (scripts/sync-version.sh updates them).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version is consistent
        run: scripts/sync-version.sh --check

  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - image: "debian:13"
            assetname: trixie
          - image: "ubuntu:24.04"
            assetname: noble
          - image: "ubuntu:26.04"
            assetname: resolute
    name: deb (${{ matrix.job.assetname }})
    steps:
      - uses: actions/checkout@v5
      - name: Build .deb in ${{ matrix.job.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.job.image }}" \
            bash /src/ci/build-deb.sh
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.job.assetname }}
          path: dist/deb/*.deb
          if-no-files-found: ignore

  rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - image: "rockylinux/rockylinux:9"
            assetname: rocky9
          - image: "rockylinux/rockylinux:10"
            assetname: rocky10
          - image: "opensuse/leap:16.0"
            assetname: leap
          - image: "opensuse/tumbleweed"
            assetname: tumbleweed
    name: rpm (${{ matrix.job.assetname }})
    steps:
      - uses: actions/checkout@v5
      - name: Build .rpm in ${{ matrix.job.assetname }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.job.image }}" \
            bash /src/ci/build-rpm.sh
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.job.assetname }}
          path: dist/rpm/*.rpm
          if-no-files-found: ignore
